async function genNeurons() {
  const raw = BRAIN_RAW;

  const out = [];
  for (const [x, y, z] of raw) {
    // The MNI brain: X = left-right, Y = posterior-anterior, Z = inferior-superior
    // Remap to our convention: ox=left-right, oy=up-down, oz=depth
    // MNI → screen: x→ox, z→oy (superior=up), -y→oz (anterior=front)
    const ox =  x * BR;
    const oy =  z * BR;       // Z (superior) becomes screen up
    const oz = -y * BR;       // -Y (anterior) becomes screen front

    // Section: left/right hemisphere × 4 depth zones
    const hemi   = ox >= 0 ? 0 : 4;
    const angIdx = Math.floor(((Math.atan2(oy, oz) + Math.PI) / (Math.PI * 2)) * 4);
    const secIdx = (hemi + angIdx) % 8;

    // Small jitter so it doesn't look like a scan artifact
    out.push({
      ox: ox + (Math.random()-0.5)*3,
      oy: oy + (Math.random()-0.5)*3,
      oz: oz + (Math.random()-0.5)*3,
      rx:0, ry:0, rz:0, sx:0, sy:0, depth:0,
      fireAlpha: 0, fireColor: [255,255,255],
      secIdx,
      connIdx: [],
    });
  }

  // ── Brainstem + spinal cord ───────────────────────────────────────────────
  // The brainstem hangs below the cerebrum (negative oy in screen space = down).
  // It tapers from ~0.28*BR at top to ~0.06*BR at the bottom of the cord.
  // Sections 1 & 5 (orange-red, blue — warm/cool midline) are reused for color.
  const STEM_NEURONS  = 90;  // brainstem bulge
  const CORD_NEURONS  = 30;  // spinal cord
  const STEM_TOP_Y    = -BR * 0.62;  // just below cerebrum base
  const STEM_BOT_Y    = -BR * 0.792; // bottom of brainstem (40% of original extension)
  const CORD_BOT_Y    = -BR * 1.092; // end of cord (40% of original extension)

  // Brainstem — ellipsoid bulge
  for (let k = 0; k < STEM_NEURONS; k++) {
    const t   = k / STEM_NEURONS;            // 0=top, 1=bottom
    const oy  = STEM_TOP_Y + (STEM_BOT_Y - STEM_TOP_Y) * t;
    const r   = BR * (0.28 - t * 0.16);      // tapers from 0.28 to 0.12
    const ang = Math.random() * Math.PI * 2;
    const rr  = r * Math.sqrt(Math.random()); // uniform disc fill
    const ox  = Math.cos(ang) * rr * 0.75;   // slightly flattened L-R
    const oz  = Math.sin(ang) * rr;
    out.push({
      ox: ox + (Math.random()-0.5)*2,
      oy: oy + (Math.random()-0.5)*4,
      oz: oz + (Math.random()-0.5)*2,
      rx:0, ry:0, rz:0, sx:0, sy:0, depth:0,
      fireAlpha: 0, fireColor: [255,255,255],
      secIdx: (k % 2 === 0) ? 1 : 2,  // orange-red / crimson-rose alternating
      connIdx: [],
    });
  }

  // Spinal cord — narrow cylinder
  for (let k = 0; k < CORD_NEURONS; k++) {
    const t   = k / CORD_NEURONS;
    const oy  = STEM_BOT_Y + (CORD_BOT_Y - STEM_BOT_Y) * t;
    const r   = BR * (0.10 - t * 0.06);      // tapers from 0.10 to 0.04
    const ang = Math.random() * Math.PI * 2;
    const rr  = r * Math.sqrt(Math.random());
    const ox  = Math.cos(ang) * rr * 0.6;
    const oz  = Math.sin(ang) * rr;
    out.push({
      ox: ox + (Math.random()-0.5)*1.5,
      oy: oy + (Math.random()-0.5)*3,
      oz: oz + (Math.random()-0.5)*1.5,
      rx:0, ry:0, rz:0, sx:0, sy:0, depth:0,
      fireAlpha: 0, fireColor: [255,255,255],
      secIdx: 0,  // red — warm spinal tone
      connIdx: [],
    });
  }

  return out;
}

// ─── Synapse generation ───────────────────────────────────────────────────────
function genSynapses(nrns) {
  const syns = [];
  const cd2  = CDIST * CDIST;
  for (let i = 0; i < nrns.length; i++) {
    const a = nrns[i];
    let cnt = 0;
    for (let j = i + 1; j < nrns.length && cnt < MCONN; j++) {
      const b  = nrns[j];
      const dx = a.ox-b.ox, dy = a.oy-b.oy, dz = a.oz-b.oz;
      if (dx*dx + dy*dy + dz*dz < cd2) {
        const si = syns.length;
        syns.push({ a:i, b:j, pulses:[] });
        a.connIdx.push(si);
        b.connIdx.push(si);
        cnt++;
      }
    }
  }
  return syns;
}

// ─── Pre-render glow stamp ────────────────────────────────────────────────────
function makeGlowStamp(size, r, g, b) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, half = size / 2;
  const grd = ctx.createRadialGradient(cx,cx,0, cx,cx,half);
  grd.addColorStop(0,   `rgba(255,255,255,1)`);
  grd.addColorStop(0.10,`rgba(255,255,255,1)`);
  grd.addColorStop(0.25,`rgba(${r},${g},${b},0.92)`);
  grd.addColorStop(0.50,`rgba(${r},${g},${b},0.50)`);
  grd.addColorStop(0.78,`rgba(${r},${g},${b},0.18)`);
  grd.addColorStop(1,   `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, size, size);
  return c;
}

// Pre-render 8 section glow stamps
const GLOW_STAMPS = SEC_COLOR.map(([r,g,b]) => makeGlowStamp(100, r, g, b));
const AMBIENT_STAMP = makeGlowStamp(100, 214, 48, 49);

// ─── BrainLoader ─────────────────────────────────────────────────────────────
class BrainLoader {
  constructor(structured, loop = false) {
    this.canvas    = document.getElementById('c');
    this.ctx       = this.canvas.getContext('2d');
    this.loop      = loop;
    this.structured = structured;
    this._resize();
    window.addEventListener('resize', () => this._resize());

    this.neurons  = [];
    this.synapses = [];

    this.angleY = 0;
    this.time   = 0;

    this.queue     = [];
    this.queueIdx  = 0;
    this.lastRel   = 0;
    this.memCount  = 0;
    this.totalMem  = 0;
    this.curSec    = '';
    this.curSecIdx = -1;
    this.particles = [];

    // State
    this.saveComplete = false;
    this.fading       = false;
    this.fadeAlpha    = 1;
    this._resolve     = null;

    // Ambient fire timer
    this.lastAmbient = 0;

    // Final burst state
    this.finalBurst = false;

    // Persistent glow state (after load completes)
    this.glowMode    = false;
    this.glowNeurons = null;
  }

  _resize() {
    this.W = this.canvas.width  = window.innerWidth;
    this.H = this.canvas.height = window.innerHeight;
    this.cx = this.W / 2;
    this.cy = this.H / 2 + 10;
  }

  // ─── Fire a neuron + cascade ────────────────────────────────────────────────
  _fire(idx, strength = 1.0, hop = 0, secIdx = -1) {
    if (hop > 3) return;
    const n = this.neurons[idx];
    if (!n) return;
    if (n.fireAlpha > 0.4 && hop > 0) return;
    n.fireAlpha = Math.max(n.fireAlpha, strength);
    if (secIdx >= 0) n.fireColor = SEC_COLOR[secIdx];
    else n.fireColor = [255, 255, 255];

    // Spawn traveling pulse on each connected synapse
    for (const si of n.connIdx) {
      const syn = this.synapses[si];
      if (!syn) continue;
      const fromA = syn.a === idx;
      syn.pulses.push({
        pos: 0,
        dir: fromA ? 1 : -1,
        alpha: strength * 0.9,
        secIdx: secIdx >= 0 ? secIdx : n.secIdx,
      });
      // Cascade to neighbor
      const neighborIdx = fromA ? syn.b : syn.a;
      const delay = 55 + Math.random() * 50;
      setTimeout(() => this._fire(neighborIdx, strength * 0.48, hop + 1, secIdx), delay);
    }
  }

  // ─── Find nearest neuron to a screen position ───────────────────────────────
  _nearestNeuron(sx, sy, secIdx = -1) {
    let best = -1, bestD = Infinity;
    for (let i = 0; i < this.neurons.length; i++) {
      const n = this.neurons[i];
      if (n.rz < -BR * 0.3) continue; // skip back-facing
      if (secIdx >= 0 && Math.random() > 0.5 && n.secIdx !== secIdx) continue;
      const dx = n.sx - sx, dy = n.sy - sy;
      const d = dx*dx + dy*dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  async start() {
    this.canvas.style.display = 'block';

    // Show loading state while fetching brain mesh
    this._drawLoading('LOADING BRAIN MESH…');
    this.neurons  = await genNeurons();
    this.synapses = genSynapses(this.neurons);

    // Build memory queue now that we know neuron count
    this.queue = []; this.totalMem = 0;
    SECTIONS.forEach((k, si) => {
      const bullets = Array.isArray(this.structured[k])
        ? this.structured[k]
        : (this.structured[k] || '').split('\n').map(l => l.replace(/^[-•*\d.)\s]+/,'').trim()).filter(l=>l.length>8);
      bullets.forEach(txt => { this.queue.push({ txt, si }); this.totalMem++; });
    });

    requestAnimationFrame(() => this._frame());
    return new Promise(res => { this._resolve = res; });
  }

  _drawLoading(msg) {
    const { ctx, W, H, cx, cy } = this;
    ctx.fillStyle = '#060606'; ctx.fillRect(0,0,W,H);
    ctx.font = '700 9px "Instrument Sans",sans-serif';
    ctx.fillStyle = 'rgba(50,50,50,1)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(msg, cx, cy);
  }

  notifySaveComplete() {
    this.saveComplete = true;
    this._checkDone();
  }

  _checkDone() {
    if (this.saveComplete && this.queueIdx >= this.queue.length &&
        this.particles.length === 0 && !this.fading) {
      this.fading = true;
      this._triggerFinalBurst();
      // After burst settles, enter persistent glow instead of fading/looping
      setTimeout(() => this._enterGlowMode(), 2800);
    }
  }

  _enterGlowMode() {
    this.glowMode = true;
    // Pick 3–4 random sections to stay lit (~40% of neurons)
    const allSec = [0,1,2,3,4,5,6,7];
    const numSec = 3 + Math.floor(Math.random() * 2); // 3 or 4 sections
    const chosen = [];
    while (chosen.length < numSec) {
      chosen.push(allSec.splice(Math.floor(Math.random() * allSec.length), 1)[0]);
    }
    this.glowNeurons = new Set(
      this.neurons.map((n, i) => chosen.includes(n.secIdx) ? i : -1).filter(i => i >= 0)
    );
    // Initial cascade to light them up
    let delay = 0;
    for (const ni of this.glowNeurons) {
      setTimeout(() => this._fire(ni, 0.85, 0, this.neurons[ni].secIdx), delay);
      delay += Math.random() * 18;
    }
  }

  _triggerFinalBurst() {
    this.finalBurst = true;
    // Fire neurons in waves across all sections
    let delay = 0;
    for (let pass = 0; pass < 3; pass++) {
      const subset = [...this.neurons].sort(() => Math.random() - 0.5).slice(0, 60);
      subset.forEach(n => {
        const ni = this.neurons.indexOf(n);
        setTimeout(() => this._fire(ni, 0.7 + Math.random() * 0.3, 0, n.secIdx), delay + Math.random() * 400);
      });
      delay += 500;
    }
  }

  _fadeOut() {
    const step = () => {
      this.fadeAlpha = Math.max(0, this.fadeAlpha - 0.025);
      if (this.fadeAlpha <= 0) {
        if (this.loop) {
          this._reset();
        } else {
          this.canvas.style.display = 'none';
          if (this._resolve) this._resolve();
        }
      } else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  _reset() {
    this.queueIdx     = 0;
    this.memCount     = 0;
    this.lastRel      = 0;
    this.particles    = [];
    this.saveComplete = false;
    this.fading       = false;
    this.fadeAlpha    = 1;
    this.finalBurst   = false;
    this.lastAmbient  = 0;
    this.queue        = [];
    this.totalMem     = 0;
    SECTIONS.forEach((k, si) => {
      const bullets = Array.isArray(this.structured[k])
        ? this.structured[k]
        : (this.structured[k]||'').split('\n').map(l=>l.replace(/^[-•*\d.)\s]+/,'').trim()).filter(l=>l.length>8);
      bullets.forEach(txt => { this.queue.push({ txt, si }); this.totalMem++; });
    });
    this.neurons.forEach(n => { n.fireAlpha = 0; });
    this.synapses.forEach(s => { s.pulses = []; });
    requestAnimationFrame(() => this._frame());
    setTimeout(() => this.notifySaveComplete(), 1600);
  }

  _frame() {
    if (this.fadeAlpha <= 0) return;
    this._update();
    this._draw();
    requestAnimationFrame(() => this._frame());
  }

  _update() {
    const now = Date.now();
    this.time++;
    this.angleY += RSPD;
    const angleX = Math.sin(this.time * 0.012) * 0.13;

    const cosY = Math.cos(this.angleY), sinY = Math.sin(this.angleY);
    const cosX = Math.cos(angleX),      sinX = Math.sin(angleX);
    const { cx, cy } = this;

    // Rotate + project neurons
    for (let i = 0; i < this.neurons.length; i++) {
      const n = this.neurons[i];
      // Y rotation
      const rx  =  n.ox * cosY + n.oz * sinY;
      const ry0 =  n.oy;
      const rz0 = -n.ox * sinY + n.oz * cosY;
      // X rotation (wobble)
      const ry =  ry0 * cosX - rz0 * sinX;
      const rz =  ry0 * sinX + rz0 * cosX;
      n.rx = rx; n.ry = ry; n.rz = rz;
      // Perspective project
      const s = FOV / (FOV + rz);
      n.sx    = cx + rx * s;
      n.sy    = cy - ry * s;
      n.depth = (rz + BR * 1.6) / (BR * 3.2); // 0 = back, 1 = front
      // Decay fire — glow neurons hold a minimum brightness
      if (n.fireAlpha > 0) {
        const floor = (this.glowMode && this.glowNeurons && this.glowNeurons.has(i)) ? 0.26 : 0;
        n.fireAlpha = Math.max(floor, n.fireAlpha - FDECAY);
      }
    }

    // Release next memory particle
    if (this.queueIdx < this.queue.length && now - this.lastRel > MEM_MS) {
      const item = this.queue[this.queueIdx++];
      this.lastRel = now;
      this.curSec    = SHORT[SECTIONS[item.si]] || SECTIONS[item.si];
      this.curSecIdx = item.si;

      // Spawn from random edge position outside brain
      const spawnAngle = Math.random() * Math.PI * 2;
      const spawnR     = BR * 1.65 + Math.random() * 80;
      this.particles.push({
        x:   cx + Math.cos(spawnAngle) * spawnR,
        y:   cy + Math.sin(spawnAngle) * spawnR,
        txt: item.txt,
        si:  item.si,
        life: 0,
        absorbed: false,
      });
    }

    // Update text particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life++;
      const dx = cx - p.x, dy = cy - p.y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      // Drift toward center
      const speed = 0.022 + (d / (BR * 2.5)) * 0.018;
      p.x += dx * speed;
      p.y += dy * speed;
      // Absorb when within brain radius
      if (d < BR * 0.88) {
        p.absorbed = true;
        this.memCount++;
        const ni = this._nearestNeuron(p.x, p.y, p.si);
        if (ni >= 0) this._fire(ni, 1.0, 0, p.si);
        this.particles.splice(i, 1);
        this._checkDone();
        continue;
      }
      if (p.life > 240) { this.particles.splice(i, 1); this._checkDone(); }
    }

    // Update synapse pulses
    for (const syn of this.synapses) {
      for (let i = syn.pulses.length - 1; i >= 0; i--) {
        const pulse = syn.pulses[i];
        pulse.pos   += 0.065;
        pulse.alpha -= 0.013;
        if (pulse.pos > 1.15 || pulse.alpha <= 0) syn.pulses.splice(i, 1);
      }
    }

    // Ambient fire — in glow mode, pulse through the lit sections frequently
    if (this.glowMode && this.glowNeurons && this.glowNeurons.size > 0) {
      if (now - this.lastAmbient > 600 + Math.random() * 700) {
        this.lastAmbient = now;
        const arr = [...this.glowNeurons];
        const ri  = arr[Math.floor(Math.random() * arr.length)];
        this._fire(ri, 0.55 + Math.random() * 0.35, 0, this.neurons[ri].secIdx);
      }
    } else if (!this.glowMode) {
      if (now - this.lastAmbient > 2200 + Math.random() * 1800) {
        this.lastAmbient = now;
        const ri = Math.floor(Math.random() * this.neurons.length);
        this._fire(ri, 0.45 + Math.random() * 0.3, 0, -1);
      }
    }
  }

  _draw() {
    const { ctx, W, H, cx, cy, fadeAlpha } = this;
    ctx.globalAlpha = fadeAlpha;

    // ── Background ──────────────────────────────────────────────
    ctx.fillStyle = '#060606';
    ctx.fillRect(0, 0, W, H);

    // Dot grid
    ctx.fillStyle = 'rgba(20,20,20,1)';
    for (let x = 14; x < W; x += 28)
      for (let y = 14; y < H; y += 28) {
        ctx.beginPath(); ctx.arc(x, y, 0.5, 0, Math.PI*2); ctx.fill();
      }

    // ── Brain ambient glow ───────────────────────────────────────
    const ag = ctx.createRadialGradient(cx, cy, 0, cx, cy, BR * 2.5);
    ag.addColorStop(0,   'rgba(214,48,49,0.12)');
    ag.addColorStop(0.4, 'rgba(214,48,49,0.05)');
    ag.addColorStop(0.75,'rgba(214,48,49,0.01)');
    ag.addColorStop(1,   'rgba(214,48,49,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(cx, cy, BR*2.2, 0, Math.PI*2); ctx.fill();

    // ── Draw resting synapses (dim web) ───────────────────────────
    ctx.lineWidth = 0.75;
    for (const syn of this.synapses) {
      const na = this.neurons[syn.a], nb = this.neurons[syn.b];
      const avgD = (na.depth + nb.depth) * 0.5;
      if (avgD < 0.18) continue; // skip back-facing
      const alpha = (avgD - 0.18) * 0.72;
      ctx.beginPath();
      ctx.moveTo(na.sx, na.sy);
      ctx.lineTo(nb.sx, nb.sy);
      ctx.strokeStyle = `rgba(200,55,55,${alpha})`;
      ctx.stroke();
    }

    // ── Draw synapse pulses (traveling signals) ───────────────────
    for (const syn of this.synapses) {
      if (!syn.pulses.length) continue;
      const na = this.neurons[syn.a], nb = this.neurons[syn.b];
      if ((na.depth + nb.depth) * 0.5 < 0.3) continue;

      for (const pulse of syn.pulses) {
        if (pulse.alpha <= 0.02) continue;
        const t0 = Math.max(0, pulse.pos - 0.22);
        const t1 = Math.min(1, pulse.pos);
        if (t1 <= t0) continue;

        const [r,g,b] = pulse.secIdx >= 0 ? SEC_COLOR[pulse.secIdx] : [255,140,80];

        // Glow line (thick, transparent)
        ctx.beginPath();
        ctx.moveTo(na.sx + (nb.sx-na.sx)*t0, na.sy + (nb.sy-na.sy)*t0);
        ctx.lineTo(na.sx + (nb.sx-na.sx)*t1, na.sy + (nb.sy-na.sy)*t1);
        ctx.strokeStyle = `rgba(${r},${g},${b},${pulse.alpha * 0.85})`;
        ctx.lineWidth = 6.0; ctx.stroke();
        // Core line (thin, bright)
        ctx.strokeStyle = `rgba(255,255,255,${pulse.alpha})`;
        ctx.lineWidth = 1.8; ctx.stroke();
      }
    }

    // ── Draw neuron glows (active) ────────────────────────────────
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const n of this.neurons) {
      if (n.fireAlpha < 0.05 || n.depth < 0.3) continue;
      const stamp = GLOW_STAMPS[n.secIdx] || AMBIENT_STAMP;
      const sz    = 48 * n.fireAlpha * (0.80 + n.depth * 0.60);
      ctx.globalAlpha = fadeAlpha * Math.min(1, n.fireAlpha * 1.1) * (0.55 + n.depth * 0.45);
      ctx.drawImage(stamp, n.sx - sz/2, n.sy - sz/2, sz, sz);
    }
    ctx.globalAlpha = fadeAlpha;
    ctx.restore();

    // ── Draw neurons (sorted back-to-front) ───────────────────────
    const sorted = [...this.neurons].sort((a, b) => a.rz - b.rz);
    for (const n of sorted) {
      const d     = n.depth;
      if (d < 0.12) continue;
      const alpha = 0.35 + d * 0.65;
      const size  = 1.4 + d * 2.4 + n.fireAlpha * 4.0;

      if (n.fireAlpha > 0.05) {
        const [r,g,b] = n.fireColor;
        const fa = n.fireAlpha * (0.6 + d * 0.4);
        ctx.fillStyle = `rgba(${Math.round(r + (255-r)*n.fireAlpha)},${Math.round(g + (255-g)*n.fireAlpha)},${Math.round(b + (255-b)*n.fireAlpha)},${fa})`;
      } else {
        ctx.fillStyle = `rgba(230,75,75,${alpha})`;
      }
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, size, 0, Math.PI*2);
      ctx.fill();
    }

    // ── Draw memory text particles ────────────────────────────────
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = '400 9px "Instrument Sans",sans-serif';
    for (const p of this.particles) {
      const dx = cx - p.x, dy = cy - p.y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      const proximity = Math.min(1, (d - BR * 0.8) / (BR * 0.9));
      const fa  = Math.min(1, p.life / 14) * proximity;
      if (fa < 0.02) continue;
      const [r,g,b] = SEC_COLOR[p.si] || [214,48,49];
      ctx.globalAlpha = fadeAlpha * fa * 0.65;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      const label = p.txt.length > 38 ? p.txt.slice(0, 38) + '…' : p.txt;
      ctx.fillText(label, p.x, p.y);
    }
    ctx.globalAlpha = fadeAlpha;

    // ── HUD ───────────────────────────────────────────────────────
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    // Memory counter below brain
    ctx.font = '700 10px "Instrument Sans",sans-serif';
    ctx.fillStyle = 'rgba(70,70,70,1)';
    ctx.fillText(`${this.memCount} / ${this.totalMem}  MEMORIES`, cx, cy + BR + 52);

    // Progress bar
    const bw = 140, bh = 1.5, bx = cx - bw/2, by = cy + BR + 67;
    ctx.fillStyle = 'rgba(22,22,22,1)'; ctx.fillRect(bx, by, bw, bh);
    const pct = this.totalMem > 0 ? this.memCount / this.totalMem : 0;
    ctx.fillStyle = 'rgba(214,48,49,0.7)'; ctx.fillRect(bx, by, bw * pct, bh);

    // Blinking section label
    const blink = Math.sin(Date.now() / 340) > 0 ? 0.9 : 0.2;
    if (this.curSec) {
      const [r,g,b] = this.curSecIdx >= 0 ? SEC_COLOR[this.curSecIdx] : [214,48,49];
      ctx.font = '700 7.5px "Instrument Sans",sans-serif';
      ctx.fillStyle = `rgba(${r},${g},${b},${blink})`;
      ctx.fillText(this.curSec, cx, cy + BR + 83);
    }

    // Top label
    ctx.font = '700 8px "Instrument Sans",sans-serif';
    ctx.fillStyle = 'rgba(34,34,34,1)';
    ctx.fillText('BUILDING NEURAL MEMORY', cx, cy - BR - 52);

    // Neuron / synapse count (subtle debug info)
    ctx.font = '400 7px "Instrument Sans",sans-serif';
    ctx.fillStyle = 'rgba(28,28,28,1)';
    ctx.fillText(`${this.neurons.length} NEURONS  ·  ${this.synapses.length} SYNAPSES`, cx, cy - BR - 38);

    // Completion flash
    if (this.fading && this.fadeAlpha > 0.2) {
      const t = Math.min(1, (1 - this.fadeAlpha) * 3.5);
      ctx.font = '700 14px "Instrument Sans",sans-serif';
      ctx.fillStyle = `rgba(214,48,49,${t})`;
      ctx.fillText('MEMORIES ABSORBED', cx, cy);
      ctx.font = '500 8px "Instrument Sans",sans-serif';
      ctx.fillStyle = `rgba(100,100,100,${t * 0.7})`;
      ctx.fillText(`${this.memCount} memories stored permanently`, cx, cy + 20);
    }

    ctx.globalAlpha = 1;
  }
}

// ─── Entry ────────────────────────────────────────────────────────────────────
window.startDemo = async () => {
  document.getElementById('startBtn').style.display = 'none';
  const loader = new BrainLoader(DEMO_DATA, true /* loop */);
  await loader.start();   // awaits mesh load before firing animation
  setTimeout(() => loader.notifySaveComplete(), 1600);
};
</script>
